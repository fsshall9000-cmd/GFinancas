<div class="container app-page">

  <div class="row justify-content-center">

    <div class="col-lg-7">

      <div class="card shadow-sm">

        <div class="card-body">

          <h2 class="mb-4">
            Editar Categoria
          </h2>

          @if (erro) {

            <div class="alert alert-danger">
              {{ erro }}
            </div>

          }

          @if (carregando) {

            <div class="text-center py-4">

              <div
                class="spinner-border"
                role="status">
              </div>

              <p class="mt-2">
                Carregando categoria...
              </p>

            </div>

          }
          @else {

            <form
              [formGroup]="form"
              (ngSubmit)="salvar()">

              <div class="mb-3">

                <label
                  for="nome"
                  class="form-label">
                  Nome
                </label>

                <input
                  id="nome"
                  type="text"
                  class="form-control"
                  formControlName="nome">

                @if (
                  form.controls.nome.touched &&
                  form.controls.nome.invalid
                ) {

                  <div class="text-danger mt-1">
                    Informe o nome da categoria.
                  </div>

                }

              </div>


              <div class="mb-4">

                <label
                  for="tipo"
                  class="form-label">
                  Tipo
                </label>

                <select
                  id="tipo"
                  class="form-select"
                  formControlName="tipo">

                  <option [ngValue]="null">
                    Selecione...
                  </option>

                  <option [ngValue]="1">
                    Receita
                  </option>

                  <option [ngValue]="2">
                    Despesa
                  </option>

                </select>

              </div>


              <div
                class="d-flex justify-content-end gap-2">

                <a
                  routerLink="/categorias"
                  class="btn btn-outline-secondary">
                  Cancelar
                </a>

                <button
                  type="submit"
                  class="btn btn-primary"
                  [disabled]="salvando">

                  @if (salvando) {
                    Salvando...
                  }
                  @else {
                    Salvar alterações
                  }

                </button>

              </div>

            </form>

          }

        </div>

      </div>

    </div>

  </div>

</div>
