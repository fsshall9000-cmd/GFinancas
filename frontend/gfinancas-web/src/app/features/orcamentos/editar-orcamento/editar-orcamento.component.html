<div class="container app-page">

  <h2 class="mb-4">
    Editar orçamento
  </h2>


  @if (mensagemErro) {

    <div class="alert alert-danger">
      {{ mensagemErro }}
    </div>

  }


  @if (carregando) {

    <div class="text-center py-5">
      Carregando...
    </div>

  } @else if (orcamento) {

    <div class="card">

      <div class="card-body">

        <div class="row g-3 mb-4">

          <div class="col-md-4">

            <label class="form-label">
              Categoria
            </label>

            <input
              type="text"
              class="form-control"
              [value]="orcamento.categoria"
              disabled>

          </div>


          <div class="col-md-4">

            <label class="form-label">
              Período
            </label>

            <input
              type="text"
              class="form-control"
              [value]="
                orcamento.mes +
                '/' +
                orcamento.ano
              "
              disabled>

          </div>


          <div class="col-md-4">

            <label class="form-label">
              Gasto atual
            </label>

            <input
              type="text"
              class="form-control"
              [value]="
                (orcamento.valorGasto
                  | currency:'BRL':'symbol':'1.2-2':'pt-BR')
              "
              disabled>

          </div>

        </div>


        <form (ngSubmit)="salvar()">

          <div class="row">

            <div class="col-md-6">

              <label class="form-label">
                Novo limite
              </label>

              <div class="input-group">

                <span class="input-group-text">
                  R$
                </span>

                <input
                  type="number"
                  class="form-control"
                  name="valorLimite"
                  [(ngModel)]="valorLimite"
                  min="0.01"
                  step="0.01"
                  required>

              </div>

            </div>

          </div>


          <div class="mt-4">

            <button
              type="submit"
              class="btn btn-primary me-2"
              [disabled]="salvando">

              @if (salvando) {
                Salvando...
              } @else {
                Salvar alterações
              }

            </button>

            <a
              routerLink="/orcamentos"
              class="btn btn-outline-secondary">
              Cancelar
            </a>

          </div>

        </form>

      </div>

    </div>

  }

</div>
